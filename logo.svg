<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" role="img" aria-labelledby="title desc">
  <title id="title">Las Palmitas — Guira de Melena</title>
  <desc id="desc">Emblema de restaurante con dos copas, plato y cubiertos; sin palmas.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="35%" r="70%"><stop offset="0" stop-color="#17472d"/><stop offset="1" stop-color="#06180f"/></radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff17a"/><stop offset=".5" stop-color="#ffc928"/><stop offset="1" stop-color="#d88913"/></linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fff9d6" stop-opacity=".95"/><stop offset="1" stop-color="#ffc928" stop-opacity=".65"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur in="SourceAlpha" stdDeviation="5"/><feOffset dy="3"/><feComponentTransfer><feFuncA type="linear" slope=".5"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <circle cx="320" cy="320" r="310" fill="url(#bg)" stroke="url(#gold)" stroke-width="8"/>
  <circle cx="320" cy="320" r="291" fill="none" stroke="#9cff3a" stroke-opacity=".35" stroke-width="2"/>
  <!-- Two celebratory glasses -->
  <g filter="url(#shadow)" stroke="url(#gold)" stroke-width="8" stroke-linejoin="round">
    <path d="M242 112h68l-9 58q-4 28-25 41-21-13-25-41z" fill="url(#glass)"/>
    <path d="M330 112h68l-9 58q-4 28-25 41-21-13-25-41z" fill="url(#glass)"/>
    <path d="M249 132h54M337 132h54" fill="none" stroke="#fff6ca" stroke-width="6" stroke-linecap="round"/>
    <path d="M276 211v27m-20 0h40m68-27v27m-20 0h40" fill="none" stroke="url(#gold)" stroke-width="7" stroke-linecap="round"/>
  </g>
  <text x="320" y="282" text-anchor="middle" fill="#f2ffe0" font-family="Georgia,serif" font-size="25" letter-spacing="5">RESTAURANTE</text>
  <!-- Plate -->
  <g filter="url(#shadow)">
    <ellipse cx="320" cy="394" rx="172" ry="91" fill="#f7f2df" stroke="url(#gold)" stroke-width="9"/>
    <ellipse cx="320" cy="391" rx="136" ry="62" fill="#fffdf5" stroke="#d7d0bc" stroke-width="5"/>
    <ellipse cx="320" cy="391" rx="108" ry="43" fill="none" stroke="#8acb42" stroke-width="3" stroke-dasharray="3 9"/>
  </g>
  <!-- Fork and knife -->
  <g fill="none" stroke="url(#gold)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" filter="url(#shadow)">
    <path d="M139 322v110M122 322v30q0 17 17 17t17-17v-30M122 322v25M156 322v25"/>
    <path d="M501 322q-25 17-25 49v61M501 322v110M501 322q24 17 24 49"/>
  </g>
  <text x="320" y="505" text-anchor="middle" fill="#baff3b" stroke="#06180f" stroke-width="3" paint-order="stroke" font-family="Georgia,'Times New Roman',serif" font-size="58" font-style="italic" font-weight="bold" filter="url(#shadow)">Las Palmitas</text>
  <path d="M131 526Q320 552 509 526" fill="none" stroke="url(#gold)" stroke-width="5"/>
  <text x="320" y="575" text-anchor="middle" fill="#ffd64a" font-family="Georgia,serif" font-size="24" font-style="italic" letter-spacing="2">Guira de Melena</text>
</svg>
