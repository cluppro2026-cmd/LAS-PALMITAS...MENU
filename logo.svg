<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" role="img" aria-labelledby="title desc">
  <title id="title">Las Palmitas — Guira de Melena</title>
  <desc id="desc">Logotipo vectorial de Las Palmitas con un plato, cubiertos y hojas de palma.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="35%" r="70%"><stop offset="0" stop-color="#17472d"/><stop offset="1" stop-color="#06180f"/></radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff17a"/><stop offset=".5" stop-color="#ffc928"/><stop offset="1" stop-color="#d88913"/></linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#d2ff54"/><stop offset="1" stop-color="#47bc28"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur in="SourceAlpha" stdDeviation="5"/><feOffset dy="3"/><feComponentTransfer><feFuncA type="linear" slope=".5"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <circle cx="320" cy="320" r="310" fill="url(#bg)" stroke="url(#gold)" stroke-width="8"/>
  <circle cx="320" cy="320" r="291" fill="none" stroke="#9cff3a" stroke-opacity=".35" stroke-width="2"/>
  <!-- palm leaves -->
  <g fill="none" stroke="url(#leaf)" stroke-width="9" stroke-linecap="round" filter="url(#shadow)">
    <path d="M320 190Q277 116 218 105M320 190Q276 147 207 151M320 190Q272 177 218 202M320 190Q299 123 287 86M320 190Q330 120 368 88M320 190Q367 123 415 111M320 190Q380 157 433 161M320 190Q376 190 420 217"/>
    <path d="M320 190Q363 116 422 105M320 190Q364 147 433 151M320 190Q368 177 422 202M320 190Q341 123 353 86M320 190Q310 120 272 88M320 190Q273 123 225 111M320 190Q260 157 207 161M320 190Q264 190 220 217" opacity=".8"/>
  </g>
  <path d="M320 187v47" stroke="#b87820" stroke-width="12" stroke-linecap="round"/>
  <!-- plate -->
  <g filter="url(#shadow)">
    <ellipse cx="320" cy="377" rx="172" ry="111" fill="#f7f2df" stroke="url(#gold)" stroke-width="9"/>
    <ellipse cx="320" cy="376" rx="136" ry="78" fill="#fffdf5" stroke="#d7d0bc" stroke-width="5"/>
    <ellipse cx="320" cy="376" rx="111" ry="56" fill="none" stroke="#8acb42" stroke-width="3" stroke-dasharray="3 9"/>
  </g>
  <!-- fork and knife -->
  <g fill="none" stroke="url(#gold)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" filter="url(#shadow)">
    <path d="M181 303v89M162 303v28q0 17 19 17t19-17v-28M162 303v24M200 303v24"/>
    <path d="M459 303q-25 16-25 47v42M459 303v89M459 303q24 16 24 47"/>
  </g>
  <text x="320" y="292" text-anchor="middle" fill="#f2ffe0" font-family="Georgia,serif" font-size="25" letter-spacing="5">RESTAURANTE</text>
  <text x="320" y="493" text-anchor="middle" fill="#baff3b" stroke="#06180f" stroke-width="3" paint-order="stroke" font-family="Georgia,'Times New Roman',serif" font-size="61" font-style="italic" font-weight="bold" filter="url(#shadow)">Las Palmitas</text>
  <path d="M131 516Q320 552 509 516" fill="none" stroke="url(#gold)" stroke-width="5"/>
  <text x="320" y="565" text-anchor="middle" fill="#ffd64a" font-family="Georgia,serif" font-size="25" font-style="italic" letter-spacing="2">Guira de Melena</text>
</svg>
