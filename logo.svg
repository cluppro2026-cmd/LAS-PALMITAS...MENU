  <text x="360" y="385" text-anchor="middle" fill="url(#green)" stroke="#101900" stroke-width="7" paint-order="stroke" font-family="Brush Script MT, cursive" font-style="italic" font-weight="bold" font-size="104" filter="url(#glow)">Palmitas</text>
