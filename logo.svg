    <linearGradient id="green" x2="0" y2="1"><stop stop-color="#b9ff00"/><stop offset="1" stop-color="#20c900"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <circle cx="360" cy="360" r="360" fill="url(#bg)"/>
  <circle cx="360" cy="358" r="248" fill="#07120d" stroke="#e9a323" stroke-width="8"/>
  <circle cx="360" cy="202" r="62" fill="#ffe900"/>
