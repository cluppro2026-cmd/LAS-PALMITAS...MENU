<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 720" role="img" aria-labelledby="title desc">
  <title id="title">Las Palmitas — Guira de Melena</title>
  <desc id="desc">Emblema tropical con palmeras, sol, mar, cerveza y café.</desc>
  <defs>
    <radialGradient id="bg"><stop stop-color="#18130a"/><stop offset="1" stop-color="#030403"/></radialGradient>
